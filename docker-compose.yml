services:
  api:
    build: .
    command: uvicorn app:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      REDIS_URL: redis://redis:6379/0
      AGENT_CACHE_TTL_SECONDS: 300
      AGENT_RATE_LIMIT_PER_MINUTE: 20
    volumes:
      - ./data:/app/data
      - ./eval_results:/app/eval_results
      - ./logs:/app/logs
      - ./vector_db:/app/vector_db
    depends_on:
      - redis

  web:
    build: .
    command: streamlit run web_demo.py --server.address 0.0.0.0 --server.port 8501
    ports:
      - "8501:8501"
    env_file:
      - .env
    environment:
      REDIS_URL: redis://redis:6379/0
    volumes:
      - ./data:/app/data
      - ./eval_results:/app/eval_results
      - ./logs:/app/logs
      - ./vector_db:/app/vector_db
    depends_on:
      - api
      - redis

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
